plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.btproxy'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.btproxy"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
}
