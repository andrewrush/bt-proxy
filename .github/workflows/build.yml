name: Build BT Proxy (J2ME + Android)
on: [push, workflow_dispatch]

jobs:
  build-j2me:
    name: Build J2ME MIDlet
    runs-on: ubuntu-latest
    container: eclipse-temurin:8-jdk
    steps:
      - uses: actions/checkout@v4
      - name: Download J2ME API stubs
        run: |
          mkdir -p j2me/lib
          wget -q -O j2me/lib/midpapi20.jar https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
          wget -q -O j2me/lib/cldcapi11.jar https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
      - name: Compile MIDlet
        run: |
          mkdir -p j2me/build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath j2me/lib/cldcapi11.jar:j2me/lib/midpapi20.jar \
            -d j2me/build/classes j2me/src/BTProxyMidlet.java
      - name: Preverify with ProGuard
        run: |
          # Скачиваем и распаковываем ProGuard
          wget -q -O j2me/lib/proguard.zip https://github.com/Guardsquare/proguard/releases/download/v7.3.2/proguard-7.3.2.zip
          unzip -q -d j2me/lib/proguard j2me/lib/proguard.zip
          
          # Создаем конфиг для преверификации под KVM (Nokia S40)
          cat > j2me/proguard.cfg << 'PGEOF'
-injars j2me/build/classes
-outjars j2me/build/preverified
-libraryjars j2me/lib/cldcapi11.jar
-libraryjars j2me/lib/midpapi20.jar
-microedition
-dontobfuscate
-dontoptimize
-dontshrink
-preverify
PGEOF
          
          # Запускаем преверификацию
          java -jar j2me/lib/proguard/lib/proguard.jar @j2me/proguard.cfg
          
          # Проверяем версию байт-кода (должно быть 46 или 47, но НЕ 50+)
          echo "--- Проверка версии байт-кода ---"
          javap -verbose j2me/build/preverified/btproxy/BTProxyMidlet.class | grep "major version" || true
          
      - name: Package JAR + JAD
        run: |
          echo "Manifest-Version: 1.0" > j2me/manifest.txt
          echo "MIDlet-Name: BTProxy" >> j2me/manifest.txt
          echo "MIDlet-Version: 1.0" >> j2me/manifest.txt
          echo "MIDlet-Vendor: andrewrush" >> j2me/manifest.txt
          echo "MIDlet-1: BTProxy,,btproxy.BTProxyMidlet" >> j2me/manifest.txt
          echo "MicroEdition-Profile: MIDP-2.0" >> j2me/manifest.txt
          echo "MicroEdition-Configuration: CLDC-1.1" >> j2me/manifest.txt
          echo "MIDlet-Permissions: javax.microedition.io.Connector.http,javax.microedition.io.Connector.https,javax.microedition.io.Connector.bluetooth" >> j2me/manifest.txt
          
          # ВАЖНО: берем классы из папки preverified, а не classes!
          jar cfm j2me/BTProxy.jar j2me/manifest.txt -C j2me/build/preverified .
          
          JAR_SIZE=$(stat -c%s j2me/BTProxy.jar)
          printf "MIDlet-Name: BTProxy\nMIDlet-Version: 1.0\nMIDlet-Vendor: andrewrush\nMIDlet-1: BTProxy,,btproxy.BTProxyMidlet\nMIDlet-Jar-URL: BTProxy.jar\nMIDlet-Jar-Size: %s\nMIDlet-Permissions: javax.microedition.io.Connector.http,javax.microedition.io.Connector.https,javax.microedition.io.Connector.bluetooth\n" "$JAR_SIZE" > j2me/BTProxy.jad
          
          echo "--- JAD CONTENT ---"
          cat j2me/BTProxy.jad
      - uses: actions/upload-artifact@v4
        with:
          name: j2me-midlet
          path: |
            j2me/BTProxy.jar
            j2me/BTProxy.jad

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
