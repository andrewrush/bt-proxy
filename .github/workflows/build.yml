name: Build BT Proxy (J2ME + Android)
on: [push, workflow_dispatch]

jobs:
  build-j2me:
    name: Build J2ME MIDlet
    runs-on: ubuntu-latest
    container: eclipse-temurin:8-jdk
    steps:
      - uses: actions/checkout@v4
      - name: Download J2ME API stubs
        run: |
          mkdir -p j2me/lib
          wget -q -O j2me/lib/midpapi20.jar https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
          wget -q -O j2me/lib/cldcapi11.jar https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
      - name: Compile MIDlet
        run: |
          mkdir -p j2me/build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath j2me/lib/cldcapi11.jar:j2me/lib/midpapi20.jar \
            -d j2me/build/classes j2me/src/BTProxyMidlet.java
      - name: Package JAR + JAD
        run: |
          cat > j2me/manifest.txt << 'MEOF'
          Manifest-Version: 1.0
          MIDlet-Name: BTProxy
          MIDlet-Version: 1.0
          MIDlet-Vendor: andrewrush
          MIDlet-1: BTProxy, , btproxy.BTProxyMidlet
          MicroEdition-Profile: MIDP-2.0
          MicroEdition-Configuration: CLDC-1.1
          MEOF
          cd j2me/build/classes
          jar cfm ../../BTProxy.jar ../../manifest.txt .
          cd ../..
          JAR_SIZE=$(stat -c%s j2me/BTProxy.jar)
          printf "MIDlet-Name: BTProxy\nMIDlet-Version: 1.0\nMIDlet-Vendor: andrewrush\nMIDlet-1: BTProxy, , btproxy.BTProxyMidlet\nMIDlet-Jar-URL: BTProxy.jar\nMIDlet-Jar-Size: %s\n" "$JAR_SIZE" > j2me/BTProxy.jad
          echo "--- JAD CONTENT ---"
          cat j2me/BTProxy.jad
          echo "--- JAR CONTENTS ---"
          jar tf j2me/BTProxy.jar
          ls -l j2me/BTProxy.jar
      - uses: actions/upload-artifact@v4
        with:
          name: j2me-midlet
          path: |
            j2me/BTProxy.jar
            j2me/BTProxy.jad

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
