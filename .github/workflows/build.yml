name: Build BT Proxy (J2ME + Android)
on: [push, workflow_dispatch]

jobs:
  build-j2me:
    name: Build J2ME MIDlet
    runs-on: ubuntu-latest
    container: eclipse-temurin:8-jdk
    steps:
      - uses: actions/checkout@v4
      - name: Download J2ME API stubs
        run: |
          mkdir -p j2me/lib
          wget -q -O j2me/lib/midpapi20.jar https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
          wget -q -O j2me/lib/cldcapi11.jar https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
          wget -q -O j2me/lib/bluecove.jar https://repo1.maven.org/maven2/net/sf/bluecove/bluecove/2.1.0/bluecove-2.1.0.jar
          jar tf j2me/lib/midpapi20.jar > /dev/null || { echo "Invalid MIDP"; exit 1; }
          jar tf j2me/lib/cldcapi11.jar > /dev/null || { echo "Invalid CLDC"; exit 1; }
          jar tf j2me/lib/bluecove.jar > /dev/null || { echo "Invalid BT"; exit 1; }
      - name: Compile MIDlet
        run: |
          mkdir -p j2me/build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath j2me/lib/cldcapi11.jar:j2me/lib/midpapi20.jar:j2me/lib/bluecove.jar \
            -d j2me/build/classes j2me/src/BTProxyMidlet.java
      - name: Package JAR + JAD
        run: |
          cd j2me/build/classes
          jar cfm ../../BTProxy.jar ../../MANIFEST.MF .
          cd ../..
          JAR_SIZE=$(stat -c%s BTProxy.jar)
          printf 'MIDlet-Name: BTProxy\nMIDlet-Version: 1.0\nMIDlet-Vendor: andrewrush\nMIDlet-1: BTProxy, , btproxy.BTProxyMidlet\nMIDlet-Jar-URL: BTProxy.jar\nMIDlet-Jar-Size: %s\n' "$JAR_SIZE" > BTProxy.jad
      - uses: actions/upload-artifact@v4
        with:
          name: j2me-midlet
          path: |
            j2me/BTProxy.jar
            j2me/BTProxy.jad

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
