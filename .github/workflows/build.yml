name: Build BT Proxy (J2ME + Android)
on: [push, workflow_dispatch]

jobs:
  build-j2me:
    name: Build J2ME MIDlet
    runs-on: ubuntu-latest
    container: eclipse-temurin:8-jdk
    steps:
      - uses: actions/checkout@v4
      - name: Download J2ME API stubs
        run: |
          mkdir -p j2me/lib
          wget -q -O j2me/lib/midpapi20.jar https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
          wget -q -O j2me/lib/cldcapi11.jar https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
      - name: Compile MIDlet
        run: |
          mkdir -p j2me/build/classes
          javac -source 1.3 -target 1.3 \
            -bootclasspath j2me/lib/cldcapi11.jar:j2me/lib/midpapi20.jar \
            -d j2me/build/classes j2me/src/BTProxyMidlet.java
      - name: Package JAR + JAD
        run: |
          cd j2me/build/classes
          # Создаем MANIFEST.MF внутри JAR
          echo "Manifest-Version: 1.0" > MANIFEST.MF
          echo "MIDlet-Name: BTProxy" >> MANIFEST.MF
          echo "MIDlet-Version: 1.0" >> MANIFEST.MF
          echo "MIDlet-Vendor: andrewrush" >> MANIFEST.MF
          echo "MIDlet-1: BTProxy,,btproxy.BTProxyMidlet" >> MANIFEST.MF
          echo "MicroEdition-Profile: MIDP-2.0" >> MANIFEST.MF
          echo "MicroEdition-Configuration: CLDC-1.1" >> MANIFEST.MF
          
          jar cfm ../../BTProxy.jar MANIFEST.MF .
          cd ../..
          
          # НАДЕЖНЫЙ расчет размера в байтах без лишних пробелов
          JAR_SIZE=$(stat -c%s BTProxy.jar)
          
          # Генерируем JAD с ЯВНЫМИ РАЗРЕШЕНИЯМИ (критично для Nokia S40)
          printf "MIDlet-Name: BTProxy\nMIDlet-Version: 1.0\nMIDlet-Vendor: andrewrush\nMIDlet-1: BTProxy,,btproxy.BTProxyMidlet\nMIDlet-Jar-URL: BTProxy.jar\nMIDlet-Jar-Size: %s\nMIDlet-Permissions: javax.microedition.io.Connector.http, javax.microedition.io.Connector.https, javax.microedition.io.Connector.bluetooth\n" "$JAR_SIZE" > BTProxy.jad
          
          # Проверка для отладки в логах CI
          echo "--- JAD FILE CONTENT ---"
          cat BTProxy.jad
          echo "--- JAR SIZE ---"
          ls -l BTProxy.jar
          
      - uses: actions/upload-artifact@v4
        with:
          name: j2me-midlet
          path: |
            j2me/BTProxy.jar
            j2me/BTProxy.jad

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          cd android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
